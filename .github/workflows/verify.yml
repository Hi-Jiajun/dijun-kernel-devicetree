name: verify

on:
  push:
  pull_request:

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dtc
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler
      - name: Python syntax
        run: python3 -m py_compile tools/*.py
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Full offline verification
        run: make verify
